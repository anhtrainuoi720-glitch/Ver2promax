#!name = Telegram Pro Max Ultimate
#!desc = Chặn quảng cáo + Tăng tốc tải + Fake Premium Telegram
#!author = Gấu Lỏz CUTO
#Telegram Pro Max - Shadowrocket Module

[Rule]
AND,((DOMAIN-SUFFIX,telegram.org),(PROTOCOL,UDP)),REJECT
AND,((DOMAIN,api.telegram.org),(PROTOCOL,UDP)),REJECT
DOMAIN-SUFFIX,ads.telegram.org,REJECT
DOMAIN-SUFFIX,promote.telegram.org,REJECT
DOMAIN-SUFFIX,sponsored.telegram.org,REJECT
DOMAIN-SUFFIX,ads.telegram.com,REJECT
DOMAIN-SUFFIX,telegram.org,DIRECT
DOMAIN-SUFFIX,t.me,DIRECT
DOMAIN-SUFFIX,telegram.me,DIRECT
DOMAIN-SUFFIX,telegra.ph,DIRECT
DOMAIN-SUFFIX,telesco.pe,DIRECT
DOMAIN-SUFFIX,telegram.dog,DIRECT
DOMAIN-SUFFIX,cdn-telegram.org,DIRECT
DOMAIN-SUFFIX,telegram-cdn.org,DIRECT
DOMAIN-SUFFIX,web.telegram.org,DIRECT

[Header Rewrite]
^https?:\/\/cdn\d+\.telegram\.org\/file\/.* header-del Accept-Encoding
^https?:\/\/cdn\d+\.telegram\.org\/file\/.* header-add Accept-Encoding: gzip, deflate, br
^https?:\/\/cdn\d+\.telegram\.org\/file\/.* header-add Connection: keep-alive
^https?:\/\/web\.telegram\.org\/.* header-add Cache-Control: max-age=3600

[Url Rewrite]
^https?:\/\/.*telegram.*\/.*sponsored.* _ reject-200
^https?:\/\/api\.telegram\.org\/.*\/sponsored.* _ reject-200
^https?:\/\/.*telegram.*\/.*promoted.* _ reject-200
^https?:\/\/api\.telegram\.org\/.*\/premium.* _ reject-200
^https?:\/\/api\.telegram\.org\/.*\/getPremium.* _ reject-200

[Script]
#Telegram Premium Fake
telegram-premium = type=http-response,pattern=^https?:\/\/api\.telegram\.org\/.*(getMe|getUser|getConfig),requires-body=1,max-size=0,script-path=https://raw.githubusercontent.com/Gaucuto/ver2promax/refs/heads/main/js/TelegramPremiumFake.js,timeout=30

#Chặn quảng cáo trong tin nhắn
telegram-ads-block = type=http-response,pattern=^https?:\/\/api\.telegram\.org\/.*(messages\.getDialogs|messages\.getHistory|updates\.getState),requires-body=1,max-size=-1,script-path=https://raw.githubusercontent.com/Gaucuto/ver2promax/refs/heads/main/js/TelegramAdsBlock.js,timeout=30

#Tăng tốc tải - cache static resources
telegram-cache = type=http-request,pattern=^https?:\/\/(cdn\d+\.telegram\.org|web\.telegram\.org)\/.*\.(js|css|png|jpg|svg|woff2?)$,script-path=https://raw.githubusercontent.com/Gaucuto/ver2promax/refs/heads/main/js/TelegramCache.js,timeout=10

[Map Local]
^https?:\/\/.*telegram.*\/.*(ads|sponsored|promoted).* data-type=text data="" status-code=200

[MITM]
hostname = %APPEND%, api.telegram.org, cdn*.telegram.org, web.telegram.org, *.telegram.org, *.t.me
